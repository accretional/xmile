syntax = "proto3";

package xml;

import "xml.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/accretional/xmile/proto/pb/xml;xmlpb";

// xml_service.proto — parsing exposed as a service (see docs/decisions/0003).
//
// The service *is* the parser: callers send XML bytes and receive the
// parsed, augmented AST. Modeled on proto-http's HttpService.Parse.
service XmlService {
  // Parse parses XML bytes into a Document AST.
  //
  // On success it returns the parsed and (if a DTD is present) validated +
  // augmented Document. The outcome is carried by the RPC status, not a
  // verdict field. Not-well-formed and invalid inputs return an error and
  // no tree, distinguished by status code:
  //   - INVALID_ARGUMENT    — not well-formed
  //   - FAILED_PRECONDITION  — well-formed but invalid against its DTD
  rpc Parse(ParseRequest) returns (ParseResponse);
}

message ParseRequest {
  bytes xml = 1;
}

message ParseResponse {
  // The parsed, augmented AST. When the document had a DOCTYPE, the parsed
  // inline DTD rides on Document.doctype (dtd.Doctype); whether the tree was
  // merely well-formed or DTD-valid is visible from there, not surfaced as a
  // separate field.
  Document document = 1;
}

// SchemaService is the *type-level* companion to XmlService (see ADR 0004).
// Where Parse takes one document's bytes and returns that document's AST,
// Compile takes a DTD (a schema for a whole family of documents) and returns a
// proto descriptor of that family: one message per <!ELEMENT>. Compiling a
// vocabulary's DTD once yields a typed AST (e.g. an rss.Rss) for every document
// in it, instead of the homogeneous Tag.
service SchemaService {
  // Compile lowers a DTD (an external subset — the bare markup declarations of
  // a .dtd file) into a FileDescriptorProto. INVALID_ARGUMENT if the bytes are
  // not a well-formed DTD.
  rpc Compile(CompileRequest) returns (CompileResponse);
}

message CompileRequest {
  // The DTD external subset to compile.
  bytes dtd = 1;
  // Naming options for the emitted descriptor; all optional.
  string package = 2;     // proto package (e.g. "rss"); defaults to "lang".
  string go_package = 3;  // go_package file option; omitted if empty.
  string file_name = 4;   // FileDescriptorProto.name; "<package>.proto" default.
}

message CompileResponse {
  // The compiled schema. It can be linked with protodesc for dynamic use or
  // written out as a .proto / FileDescriptorSet.
  google.protobuf.FileDescriptorProto file = 1;
}
