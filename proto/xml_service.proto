syntax = "proto3";

package xml;

import "xml.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/accretional/xmile/proto/pb/xml;xmlpb";

// xml_service.proto — the xmile services (see docs/decisions/0008).
//
// Two services, split by phase. Documents.Process is the unified instance-level
// classifier: it parses bytes into the generic XML AST and, given a schema,
// projects that AST into the schema's typed message — generic XML being simply
// the loosest schema, so Process with no schema is the former Parse and a
// format selector is the former ParseRss. Schemas.Compile is the type-level
// companion: it lowers a metagrammar (DTD / EBNF vocabulary / XSD) into a proto
// descriptor of the document family it governs.
//
// As with the old surface the RPC status stays OK for a rejected document: the
// service did its job; the verdict rides in the response.

// Verdict classifies a Process outcome.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  NOT_WELL_FORMED = 1;   // syntactically not a document
  WELL_FORMED = 2;       // accepted, not validated (no schema, project-only)
  VALID = 3;             // accepted and validated against its schema / DTD
  INVALID = 4;           // well-formed but breaks its schema / DTD
  CANNOT_VALIDATE = 5;   // validation requested but the DTD cannot be fully read
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  ERROR = 1;
  WARNING = 2;
}

// Diagnostic is a non-fatal finding (soft conformance), severity-tagged so a
// vocabulary's "SHOULD" rules are reported without failing the parse.
message Diagnostic {
  Severity severity = 1;
  string reason = 2;
}

enum Mode {
  PROJECT_ONLY = 0;  // parse / project and report; do not enforce validity
  VALIDATE = 1;      // enforce validity (the DTD for generic XML; vocabulary coverage for a schema)
}

// Documents is the instance-level service: bytes (+ optional schema) -> result.
service Documents {
  rpc Process(ProcessRequest) returns (ProcessResponse);
}

message ProcessRequest {
  bytes source = 1;
  // schema selects the vocabulary to project into. Unset -> generic XML (the
  // homogeneous Tag tree, i.e. the former Parse). A registered format name or
  // an inline metagrammar compile projects into that vocabulary's typed tree.
  oneof schema {
    string format = 2;          // a registered format, e.g. "rss-2.0"
    CompileRequest compile = 3; // compile a metagrammar, then project against it
  }
  Mode mode = 4;
}

message ProcessResponse {
  oneof result {
    Document document = 1;   // no schema: the generic XML AST
    TypedTree typed = 2;     // a schema: the projected typed tree, self-describing
    ProcessError error = 3;  // refusal
  }
  Verdict verdict = 4;
  repeated Diagnostic diagnostics = 5;  // soft conformance (severity WARNING)
}

message ProcessError {
  Verdict verdict = 1;
  string reason = 2;
}

// TypedTree carries a projected message plus the descriptor needed to decode it,
// so a dynamic (runtime-compiled) vocabulary's tree is self-describing on the
// wire: the client links `schema` with protodesc and unmarshals `message` into a
// dynamicpb message of `root_message`.
message TypedTree {
  google.protobuf.FileDescriptorProto schema = 1;
  string root_message = 2;
  bytes message = 3;
}

// Schemas is the type-level service: a metagrammar -> a proto descriptor.
service Schemas {
  rpc Compile(CompileRequest) returns (CompileResponse);
}

enum SchemaLanguage {
  SCHEMA_LANGUAGE_UNSPECIFIED = 0;  // treated as EBNF_VOCAB
  DTD = 1;
  EBNF_VOCAB = 2;
  XSD = 3;
}

message CompileRequest {
  bytes source = 1;
  SchemaLanguage language = 2;
  string package = 3;     // proto package (e.g. "rss"); defaults to "lang"
  string go_package = 4;  // go_package file option; omitted if empty
  string file_name = 5;   // FileDescriptorProto.name; "<package>.proto" default
}

message CompileResponse {
  oneof result {
    google.protobuf.FileDescriptorProto file = 1;
    string error = 2;
  }
}
