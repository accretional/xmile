syntax = "proto3";

package xml;

import "xml.proto";
import "rss.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/accretional/xmile/proto/pb/xml;xmlpb";

// xml_service.proto — parsing exposed as a service (see docs/decisions/0006).
//
// The service *is* the parser, and it is a classifier: callers send XML bytes
// and receive either the parsed AST or a typed verdict explaining the refusal.
// The RPC succeeds (the service did its job); the outcome rides in the response.
service XmlService {
  // Parse parses XML bytes and returns the document AST, or a verdict.
  //
  // ParseResponse is a oneof: a Document when the input is accepted, or a
  // ParseError (verdict + reason) when it is refused. The RPC status is OK in
  // both cases; a non-OK status is a genuine server fault, not a bad document.
  rpc Parse(ParseRequest) returns (ParseResponse);

  // ParseRss parses RSS 2.0 bytes the way Parse handles generic XML, then
  // walks the resulting Tag tree into the typed RSS AST compiled from
  // lang/rss.ebnf (see service/rss.go). It is the "generic XML AST + walk
  // against a vocabulary" path applied to one format. Like Parse it is a
  // classifier: the reply carries the typed AST or a verdict, never a non-OK
  // status for a bad document. Namespace-qualified extensions are tolerated;
  // an unprefixed out-of-vocabulary element is INVALID.
  rpc ParseRss(ParseRssRequest) returns (ParseRssResponse);
}

message ParseRssRequest {
  bytes xml = 1;
}

message ParseRssResponse {
  // The typed RSS AST (rss.Rss, the proto compiled from lang/rss.ebnf) on
  // acceptance, or a ParseError on refusal.
  oneof response {
    rss.Rss rss = 1;
    ParseError error = 2;
  }
}

message ParseRequest {
  bytes xml = 1;
  // validate selects the parser mode (XML's validating vs non-validating
  // processor distinction). When false, only well-formedness is checked and
  // any well-formed document is accepted. When true, the document is validated
  // against its DTD: it must have one and satisfy it.
  bool validate = 2;
}

// Verdict classifies why a document was refused.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  NOT_WELL_FORMED = 1;  // syntactically not a document
  INVALID = 2;          // well-formed but breaks its DTD (validate=true)
  CANNOT_VALIDATE = 3;  // validate=true, but the DTD cannot be fully read
                        // (external subset / external parameter entities)
}

message ParseError {
  Verdict verdict = 1;
  string reason = 2;  // human-readable detail
}

message ParseResponse {
  // A Document on acceptance, or a ParseError on refusal, never both. There is
  // no point returning a tree for input that is not well-formed or not valid.
  oneof response {
    Document document = 1;
    ParseError error = 2;
  }
}

// SchemaService is the *type-level* companion to XmlService (see ADR 0004).
// Where Parse takes one document's bytes and returns that document's AST,
// Compile takes a DTD (a schema for a whole family of documents) and returns a
// proto descriptor of that family: one message per <!ELEMENT>. Compiling a
// vocabulary's DTD once yields a typed AST (e.g. an rss.Rss) for every document
// in it, instead of the homogeneous Tag.
service SchemaService {
  // Compile lowers a DTD (an external subset — the bare markup declarations of
  // a .dtd file) into a FileDescriptorProto. INVALID_ARGUMENT if the bytes are
  // not a well-formed DTD.
  rpc Compile(CompileRequest) returns (CompileResponse);
}

message CompileRequest {
  // The DTD external subset to compile.
  bytes dtd = 1;
  // Naming options for the emitted descriptor; all optional.
  string package = 2;     // proto package (e.g. "rss"); defaults to "lang".
  string go_package = 3;  // go_package file option; omitted if empty.
  string file_name = 4;   // FileDescriptorProto.name; "<package>.proto" default.
}

message CompileResponse {
  // The compiled schema. It can be linked with protodesc for dynamic use or
  // written out as a .proto / FileDescriptorSet.
  google.protobuf.FileDescriptorProto file = 1;
}
